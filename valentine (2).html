<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine? 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffeef8 0%, #ffe0f0 50%, #ffd6eb 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Floating hearts background */
        .heart-bg {
            position: fixed;
            font-size: 20px;
            opacity: 0.3;
            animation: float 15s infinite;
            pointer-events: none;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.3;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Main container */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 60px 40px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(255, 105, 180, 0.3);
            max-width: 500px;
            width: 90%;
            position: relative;
            z-index: 10;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header with image placeholder */
        .header-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        h1 {
            color: #ff1744;
            font-size: 2.5em;
            margin-bottom: 20px;
            animation: fadeIn 1.5s ease-in;
            text-shadow: 2px 2px 4px rgba(255, 105, 180, 0.2);
        }

        .message {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 40px;
            line-height: 1.6;
            animation: fadeIn 2s ease-in;
        }

        .question {
            font-size: 2em;
            color: #e91e63;
            font-weight: bold;
            margin-bottom: 40px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }

        /* Buttons */
        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
            position: relative;
        }

        button {
            padding: 15px 40px;
            font-size: 1.3em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .yes-btn {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff1744 100%);
            color: white;
        }

        .yes-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(255, 23, 68, 0.4);
        }

        .no-btn {
            background: linear-gradient(135deg, #ffeef8 0%, #ffd6eb 100%);
            color: #e91e63;
            border: 2px solid #ff6b9d;
            position: relative;
        }

        .no-btn:hover {
            background: linear-gradient(135deg, #ffe0f0 0%, #ffcce0 100%);
        }

        /* Success message */
        .success-message {
            display: none;
            animation: celebrate 1s ease-in;
        }

        @keyframes celebrate {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .success-message h2 {
            color: #ff1744;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .success-message p {
            color: #666;
            font-size: 1.3em;
            margin-bottom: 20px;
        }

        .celebration-hearts {
            font-size: 3em;
            margin: 20px 0;
            animation: heartBeat 1.5s infinite;
        }

        @keyframes heartBeat {
            0%, 100% {
                transform: scale(1);
            }
            25% {
                transform: scale(1.1);
            }
            50% {
                transform: scale(1);
            }
            75% {
                transform: scale(1.15);
            }
        }

        /* Tease message */
        .tease-message {
            margin-top: 20px;
            color: #ff6b9d;
            font-style: italic;
            min-height: 30px;
            font-size: 1.1em;
        }

        /* Confetti */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #ff1744;
            position: absolute;
            animation: confetti-fall 3s linear;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Mobile responsiveness */
        @media (max-width: 600px) {
            .container {
                padding: 40px 20px;
            }

            h1 {
                font-size: 2em;
            }

            .question {
                font-size: 1.5em;
            }

            button {
                padding: 12px 30px;
                font-size: 1.1em;
            }

            .buttons {
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Floating hearts background -->
    <div class="hearts-container"></div>

    <!-- Main container -->
    <div class="container">
        <div id="questionSection">
            <div class="header-image">💕</div>
            <h1>Hey buccha! 🌹</h1>
            <p class="message">
                You've been my best friend, my safe place, and my favorite person… so I figured I should make it official 💭
            </p>
            <div class="question">Will you be my Valentine? 💖</div>
            
            <div class="buttons">
                <button class="yes-btn" onclick="handleYes()">Yes! 💖</button>
                <button class="no-btn" id="noBtn" onclick="handleNo()">No 🙈</button>
            </div>
            
            <div class="tease-message" id="teaseMessage"></div>
        </div>

        <div class="success-message" id="successMessage">
            <div class="celebration-hearts">💕 💖 💗 💕</div>
            <h2>Good Girl! 🎉</h2>
            <p>good choice buccha ji 😊</p>
            <p>Best decision you've made today by making me your Valentine forever 🌹</p>
            <div class="celebration-hearts">💝 ❤️ 💓 💝</div>
        </div>
    </div>

    <script>
        // Create floating hearts background
        function createFloatingHearts() {
            const heartsContainer = document.querySelector('.hearts-container');
            const hearts = ['❤️', '💕', '💖', '💗', '💝', '💓'];
            
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-bg';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 15 + 's';
                heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
                heartsContainer.appendChild(heart);
            }
        }

        // Tease messages when "No" is clicked
        const teaseMessages = [
            "Are you sure? Think again! 🥺",
            "Really? My heart is breaking... 💔",
            "Come on, give me a chance! 🙏",
            "Please? Pretty please? 🥹",
            "I promise I'll be the best Valentine! 💝",
            "aisa karo ge buccha abb ? 😊",
            "The button is right there... just click it! 👉",
            "I won't give up! How about now? 💪",
            "Okay, last chance... please? 🌹"
        ];

        let noClickCount = 0;

        function handleNo() {
            const noBtn = document.getElementById('noBtn');
            const teaseMessage = document.getElementById('teaseMessage');
            const yesBtn = document.querySelector('.yes-btn');
            
            // Increment click count first
            noClickCount++;
            
            // Make No button disappear after 7 clicks
            if (noClickCount >= 7) {
                noBtn.style.display = 'none';
                teaseMessage.textContent = "The No button is gone! You know what to do(hehehheehhehhehheehehe)";
                teaseMessage.style.color = '#ff1744';
                teaseMessage.style.fontWeight = 'bold';
                teaseMessage.style.fontSize = '1.3em';
                return; // Stop the function here
            }
            
            // Show tease message
            teaseMessage.textContent = teaseMessages[(noClickCount - 1) % teaseMessages.length];
            
            // Make YES button bigger with each click - starts from first click!
            const newScale = 1 + (noClickCount * 0.2); // Grows 20% bigger each time
            yesBtn.style.transform = 'scale(' + newScale + ')';
            yesBtn.style.transition = 'transform 0.3s ease';
            
            // Make button move to random position (playful effect)
            const container = noBtn.parentElement;
            const containerRect = container.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();
            
            // Calculate random position within container
            const maxX = containerRect.width - btnRect.width - 40;
            const maxY = 100;
            
            const randomX = Math.random() * maxX - (maxX / 2);
            const randomY = Math.random() * maxY - 50;
            
            noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
            noBtn.style.transition = 'transform 0.3s ease';
            
            // After many clicks, make No button smaller and harder to click
            if (noClickCount >= 3) {
                const shrinkScale = 1 - (noClickCount * 0.1);
                noBtn.style.fontSize = Math.max(0.5, shrinkScale) + 'em';
                noBtn.style.opacity = Math.max(0.3, 1 - (noClickCount * 0.1));
            }
        }

        function handleYes() {
            // Hide question section
            document.getElementById('questionSection').style.display = 'none';
            
            // Show success message
            const successMessage = document.getElementById('successMessage');
            successMessage.style.display = 'block';
            
            // Create confetti effect
            createConfetti();
            
            // Change background to more celebratory
            document.body.style.background = 'linear-gradient(135deg, #fff0f6 0%, #ffe6f2 50%, #ffd9ed 100%)';
        }

        function createConfetti() {
            const colors = ['#ff1744', '#ff6b9d', '#ffd6eb', '#ff9a9e', '#e91e63'];
            const container = document.body;
            
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.top = '-10px';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.width = (Math.random() * 10 + 5) + 'px';
                    confetti.style.height = confetti.style.width;
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                    container.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 3000);
                }, i * 30);
            }
        }

        // Initialize floating hearts
        createFloatingHearts();
    </script>
</body>
</html>
